name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; release declares its own.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress.
# Pushes to main and tags get a group of their own (the run id), so they are
# never queued behind, or cancelled by, another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MQTT_Lab (fork of MQTT Scope): the Arch Linux pkgbuild and AUR jobs of the
# original are removed, they publish under MQTT Scope's names and accounts.
#
# Pushes to main run `test` only. Pull requests also run package as a dry run
# (installers built and smoke-tested on all three OSes; nothing is published).
# Pushing any v* tag cuts a release:
#
#   test -> package -> release
#
# package   For a tag, fails at once unless the tag is v<package.json version>.
#           Then builds the installers on Linux, Windows and macOS and
#           smoke-tests each. Every electron-builder call passes
#           `--publish never`: CI attaches files itself.
#           (`build.publish` in package.json does not publish anything; it tells
#           packaged apps which GitHub repository to check for updates.)
# release   Publishes the GitHub release in one step (softprops creates a draft,
#           uploads, then publishes), so it never appears with files missing.
#           It carries the installers plus electron-builder's update
#           description files (latest.yml, latest-linux.yml, latest-mac.yml)
#           and *.blockmap files, which the in-app updater (electron-updater)
#           reads from the latest release to update the AppImage and the
#           Windows installer build in place. Release notes come from the
#           version's section in CHANGELOG.md. Every file is attested.
#
# Asset names are part of the updater's contract: installs already out there
# fetch latest*.yml and the installers those files name by exact name, so
# renaming any of them breaks their updates.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - name: End-to-end tests (real Electron app, headless)
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # update-info: the update description file this OS's build must write.
          - os: ubuntu-latest
            dist: dist:linux
            update-info: latest-linux.yml
          - os: windows-latest
            dist: dist:win
            update-info: latest.yml
          - os: macos-latest
            dist: dist:mac
            update-info: latest-mac.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unsigned builds; add signing secrets (CSC_LINK etc.) to sign.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Installers and update files take their version from package.json; the
      # release and the PKGBUILD (pkgver, download URLs) take it from the tag.
      # A mismatch would publish a release no install can update to.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected tag v$version)"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $version"
      - run: npm ci
      - run: npm run ${{ matrix.dist }} -- --publish never
      # A release without its update description file (or one naming a file
      # that is not uploaded) silently stops installs from updating.
      - name: Check the update description file
        shell: bash
        env:
          UPDATE_INFO: dist/${{ matrix.update-info }}
        run: |
          if [ ! -f "$UPDATE_INFO" ]; then echo "::error::electron-builder did not write $UPDATE_INFO"; exit 1; fi
          cat "$UPDATE_INFO"
          urls="$(sed -n 's/^ *- url: //p' "$UPDATE_INFO")"
          if [ -z "$urls" ]; then echo "::error::$UPDATE_INFO lists no files"; exit 1; fi
          for url in $urls; do
            if [ ! -f "dist/$url" ]; then echo "::error::$UPDATE_INFO names $url, which is not in dist/"; exit 1; fi
          done
      - name: Smoke-test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify:package
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: npm run verify:package
      # The release job merges all three artifacts into one folder, so every
      # file name must be unique across OSes: installers and blockmaps carry
      # the OS in their name, and each OS writes a differently named latest*.yml.
      # The Linux AppImage embeds its blockmap, so Linux uploads no .blockmap.
      # A pull request's installers are kept 7 days; a tag's for the repository
      # default (0), so failed release jobs can still be re-run.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 0 }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap

  # Tags only: on a pull request package succeeds too, and this would publish
  # a release.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
      # Signed record that each file was built by this workflow from this
      # commit; verify with `gh attestation verify <file> --repo MatthiasHolzapfel/mqtt-scope-sparkplug`.
      - uses: actions/attest@v4
        with:
          subject-path: artifacts/*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: true
